}
function refineDesignModel(){
  const btn = el('refine-btn');
  if (btn){ btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Refining\u2026`; }
  setTimeout(() => {
    const n = state.designLayers.length;
    const sorted = state.data.slice().sort((a,b)=>a.ab2-b.ab2);
    const ab2List = sorted.map(p=>p.ab2), rhoList = sorted.map(p=>p.rho);
  const mn2List = sorted.map(p=>p.mn2);

    const minObsRho = Math.min(...rhoList), maxObsRho = Math.max(...rhoList);
    const minAb2 = Math.min(...ab2List), maxAb2 = Math.max(...ab2List);
    const resLoLog = Math.log10(minObsRho) - Math.log10(50);
    const resHiLog = Math.log10(maxObsRho) + Math.log10(200);
    const deepResHiLog = Math.min(resHiLog, Math.log10(state.resCeiling));
    const resHiLogFor = (i) => (i === n - 1) ? deepResHiLog : resHiLog;
    const thkFloor = Math.max(0.05 * minAb2, 0.15);
    const thkCeil = Math.max(maxAb2, thkFloor * 10); // depth-of-investigation cap: a VES sounding cannot reliably resolve depths beyond roughly its max AB/2
    const thkLoLog = Math.log10(thkFloor), thkHiLog = Math.log10(thkCeil);

    function decode(params){
      const res = params.slice(0,n).map((p,i) => boundedFromParam(p, resLoLog, resHiLogFor(i)));
      const thk = params.slice(n).map(p => boundedFromParam(p, thkLoLog, thkHiLog));
      return [res, thk];
    }
    function residuals(params){
      const [res, thk] = decode(params);
      let predicted;
      try { predicted = forwardModelSchlumberger(res, thk, ab2List, mn2List); }
      catch(e){ return ab2List.map(()=>1e3); }
      return rhoList.map((obs,i) => {
        const pred = predicted[i];
        if (!(pred > 0) || !isFinite(pred)) return 1e3;
        return Math.log10(obs) - Math.log10(pred);
      });
    }

    // Seed directly from the values currently in the form -- this is a
    // *local* refinement of your own starting point (not the broad
    // multi-seed search auto-invert runs), so a few small jittered
    // restarts around your input, not a wide structural search.
    const userRes = state.designLayers.map(l => Math.max(l.rho, 0.01));
    const userThk = state.designLayers.slice(0,-1).map(l => Math.max(l.h, 0.01));
    const baseX0 = userRes.map((r,i) => paramFromBounded(r, resLoLog, resHiLogFor(i)))
      .concat(userThk.map(t => paramFromBounded(t, thkLoLog, thkHiLog)));

    let best = null;
    for (let attempt = 0; attempt < 6; attempt++){
      const x0 = attempt === 0 ? baseX0 : baseX0.map(v => v + (Math.random()*0.8 - 0.4));
      const cand = levenbergMarquardt(residuals, x0, {maxIter: 100});
      if (!best || cand.cost < best.cost) best = cand;
    }

    const method = state.refineMethod || 'bestfit';
    const finalX = method === 'smoothed'
      ? adaptiveSmoothFromBaseline(residuals, decode, best.x, best.cost, 1.3)
      : best.x;

    const [finalRes, finalThk] = decode(finalX);
    const predicted = forwardModelSchlumberger(finalRes, finalThk, ab2List, mn2List);
    const sqPct = rhoList.map((obs,i)=> Math.pow((obs-predicted[i])/obs, 2));
    const rmsPercent = Math.sqrt(sqPct.reduce((a,b)=>a+b,0)/sqPct.length) * 100;
    const depths = []; let running = 0;
    finalThk.forEach(t=>{ running += t; depths.push(running); });

    // Reflect the refined values back into the editable form so the user
    // can inspect them, keep tweaking, and refine again if they want.
    state.designLayers = finalRes.map((r,i) => ({
      rho: Math.round(r*100)/100,
      h: i < finalThk.length ? Math.round(finalThk[i]*100)/100 : null,
    }));

    state.lastModel = {
      source: 'design', refined: true, method, nLayers: n,
      resistivities: finalRes, thicknesses: finalThk, depths, rmsPercent,
        observed: sorted.map(p=>[p.ab2,p.rho]),
      predicted: ab2List.map((x,i)=>[x, predicted[i]]),
    };
    render();
  }, 40);
}

// Runs just a few Levenberg-Marquardt steps from the CURRENT design values
// (not a full multi-restart search to convergence, and not the Occam
// smoothing option -- this is meant to be the plain, transparent, watchable
// middle ground between a pure theoretical preview and a one-click final
// answer). Repeated clicks feed the previous result back in as the next
// starting point, so the model visibly walks toward the field curve one
// small step at a time, and the user can stop as soon as they're satisfied.
const DESIGN_ITERATION_STEPS = 3;
function iterateDesignModel(){
  const btn = el('iterate-btn');
  if (btn){ btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Iterating\u2026`; }
  setTimeout(() => {
    const n = state.designLayers.length;
    const sorted = state.data.slice().sort((a,b)=>a.ab2-b.ab2);
    const ab2List = sorted.map(p=>p.ab2), rhoList = sorted.map(p=>p.rho);
  const mn2List = sorted.map(p=>p.mn2);

    const minObsRho = Math.min(...rhoList), maxObsRho = Math.max(...rhoList);
    const minAb2 = Math.min(...ab2List), maxAb2 = Math.max(...ab2List);
    const resLoLog = Math.log10(minObsRho) - Math.log10(50);
    const resHiLog = Math.log10(maxObsRho) + Math.log10(200);
    const deepResHiLog = Math.min(resHiLog, Math.log10(state.resCeiling));
    const resHiLogFor = (i) => (i === n - 1) ? deepResHiLog : resHiLog;
    const thkFloor = Math.max(0.05 * minAb2, 0.15);
    const thkCeil = Math.max(maxAb2, thkFloor * 10);
    const thkLoLog = Math.log10(thkFloor), thkHiLog = Math.log10(thkCeil);

    function decode(params){
      const res = params.slice(0,n).map((p,i) => boundedFromParam(p, resLoLog, resHiLogFor(i)));
      const thk = params.slice(n).map(p => boundedFromParam(p, thkLoLog, thkHiLog));
      return [res, thk];
    }
    function residuals(params){
      const [res, thk] = decode(params);
      let predicted;
      try { predicted = forwardModelSchlumberger(res, thk, ab2List, mn2List); }
      catch(e){ return ab2List.map(()=>1e3); }
      return rhoList.map((obs,i) => {
        const pred = predicted[i];
        if (!(pred > 0) || !isFinite(pred)) return 1e3;
        return Math.log10(obs) - Math.log10(pred);
      });
    }

    // Snapshot the pre-iteration values once, the first time a sequence
    // starts, so "Reset to my original values" has something to return to.
    if (state.designIterationCount === 0){
      state.designIterationSnapshot = state.designLayers.map(l => ({...l}));
    }

    const curRes = state.designLayers.map(l => Math.max(l.rho, 0.01));
    const curThk = state.designLayers.slice(0,-1).map(l => Math.max(l.h, 0.01));
    const x0 = curRes.map((r,i) => paramFromBounded(r, resLoLog, resHiLogFor(i)))
      .concat(curThk.map(t => paramFromBounded(t, thkLoLog, thkHiLog)));

    const stepped = levenbergMarquardt(residuals, x0, {maxIter: DESIGN_ITERATION_STEPS});
    const [finalRes, finalThk] = decode(stepped.x);
    const predicted = forwardModelSchlumberger(finalRes, finalThk, ab2List, mn2List);
    const sqPct = rhoList.map((obs,i)=> Math.pow((obs-predicted[i])/obs, 2));
    const rmsPercent = Math.sqrt(sqPct.reduce((a,b)=>a+b,0)/sqPct.length) * 100;
    const depths = []; let running = 0;
    finalThk.forEach(t=>{ running += t; depths.push(running); });

    state.designLayers = finalRes.map((r,i) => ({
      rho: Math.round(r*100)/100,
      h: i < finalThk.length ? Math.round(finalThk[i]*100)/100 : null,
    }));
    state.designIterationCount++;

    state.lastModel = {
      source: 'design', refined: true, method: 'iterate', nLayers: n,
      resistivities: finalRes, thicknesses: finalThk, depths, rmsPercent,
      observed: sorted.map(p=>[p.ab2,p.rho]),
      predicted: ab2List.map((x,i)=>[x, predicted[i]]),
    };
    render();
  }, 40);
}

  state.lastModel = null;
  state.metadata = { project:'', station:'', geologist:'', gps:'' };
  state.justRestored = 0;
  state.gpsError = null;
  state.gpsNote = null;
  clearSessionStorage();
  closeModal();
  state.tab = 'setup';
  render();
}

const wasRestored = restoreSessionIfAvailable();
if (wasRestored) state.tab = 'data';
render();
