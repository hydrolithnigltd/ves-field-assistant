<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>VES Field Assistant</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b5730e">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f3;
    --panel:#ffffff;
    --panel-2:#f3efe4;
    --panel-3:#e9e1cf;
    --line: rgba(120,72,22,0.14);
    --line-strong: rgba(120,72,22,0.36);
    --text:#332f28;
    --text-dim:#76695c;
    --text-dimmer:#a89d89;
    --amber:#b5730e;
    --on-amber:#fff8ea;
    --amber-dim: rgba(181,115,14,0.55);
    --teal:#1f6259;
    --rust:#a63a2c;
    --olive:#5c7a34;
    --font-d:'Space Grotesk', system-ui, -apple-system, sans-serif;
    --font-m:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-m); font-size:14px;
    display:flex; justify-content:center;
    overscroll-behavior:none;
  }
  #shell{
    width:100%; max-width:480px; min-height:100dvh;
    display:flex; flex-direction:column;
    background:var(--bg);
    position:relative;
    border-left:1px solid var(--line); border-right:1px solid var(--line);
  }

  /* ---- Top bar ---- */
  #topbar{
    padding:16px 18px 12px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--panel-2), var(--bg));
    flex-shrink:0;
  }
  #topbar .brand{
    font-family:var(--font-d); font-weight:700; font-size:19px;
    letter-spacing:0.2px; color:var(--text); display:flex; align-items:center; gap:9px;
  }
  #topbar .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px var(--amber-dim);}
  #topbar .byline{
    font-family:var(--font-m); font-size:9.5px; color:var(--text-dimmer); margin:2px 0 0 18px; letter-spacing:0.3px;
  }
  #topbar .status-row{
    margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    font-size:11.5px; color:var(--text-dim);
  }
  .chip{
    border:1px solid var(--line-strong); border-radius:3px; padding:3px 8px;
    color:var(--text-dim); white-space:nowrap; display:inline-flex; align-items:center; gap:5px;
    background:var(--panel);
  }
  .chip b{color:var(--text); font-weight:600;}

  /* ---- Panel / scroll area ---- */
  #panel{
    flex:1; overflow-y:auto; padding:18px 18px 100px;
  }
  .section-title{
    font-family:var(--font-d); font-weight:600; font-size:15px; color:var(--text);
    margin:0 0 4px;
  }
  .section-sub{ font-size:12px; color:var(--text-dimmer); margin:0 0 18px; line-height:1.5;}

  label{ display:block; font-size:11px; color:var(--text-dim); margin:14px 0 6px; letter-spacing:0.2px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number]{
    width:100%; background:var(--panel-2); border:1px solid var(--line-strong);
    color:var(--text); padding:11px 12px; border-radius:4px; font-family:var(--font-m);
    font-size:14.5px; outline:none;
  }
  input:focus{ border-color:var(--amber); }
  input::placeholder{color:var(--text-dimmer);}

  .btn{
    font-family:var(--font-d); font-weight:600; font-size:13.5px;
    border-radius:4px; border:1px solid var(--line-strong); background:var(--panel-2);
    color:var(--text); padding:12px 16px; cursor:pointer; text-align:center;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:border-color .15s, background .15s;
  }
  .btn:active{transform:translateY(1px);}
  .btn.primary{ background:var(--amber); border-color:var(--amber); color:var(--on-amber);}
  .btn.primary:hover{background:#c17f17;}
  .btn.ghost{ background:transparent; }
  .btn.danger{ border-color:rgba(166,58,44,0.5); color:var(--rust);}
  .btn.block{width:100%;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-row{display:flex; gap:10px; margin-top:16px;}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:16px; margin-bottom:14px;
  }
  .divider{height:1px; background:var(--line); margin:18px 0;}

  .seg{
    display:flex; border:1px solid var(--line-strong); border-radius:5px; overflow:hidden; margin-bottom:16px;
  }
  .seg button{
    flex:1; background:var(--panel-2); color:var(--text-dim); border:none; padding:10px 4px;
    font-family:var(--font-d); font-weight:600; font-size:12px; cursor:pointer; border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--amber); color:var(--on-amber);}

  .array-pick{ display:flex; flex-direction:column; gap:10px; }
  .array-opt{
    border:1px solid var(--line-strong); border-radius:6px; padding:13px 14px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; background:var(--panel);
  }
  .array-opt .name{font-family:var(--font-d); font-weight:600; font-size:14px; color:var(--text);}
  .array-opt .desc{font-size:11px; color:var(--text-dimmer); margin-top:2px;}
  .array-opt.active{border-color:var(--amber); background:rgba(181,115,14,0.08);}
  .array-opt .radio{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line-strong); flex-shrink:0;}
  .array-opt.active .radio{border-color:var(--amber); background:radial-gradient(circle, var(--amber) 0 40%, transparent 44%);}

  .alert{
    border-radius:5px; padding:11px 13px; font-size:12.5px; margin-bottom:14px; line-height:1.5;
    border:1px solid; display:flex; gap:9px; align-items:flex-start;
  }
  .alert.err{ background:rgba(166,58,44,0.09); border-color:rgba(166,58,44,0.4); color:#7a2318;}
  .alert.info{ background:rgba(31,98,89,0.09); border-color:rgba(31,98,89,0.4); color:#123f38;}
  .alert.ok{ background:rgba(92,122,52,0.09); border-color:rgba(92,122,52,0.4); color:#3c5222;}

  /* ---- Data table ---- */
  .row-item{
    border:1px solid var(--line); border-left:3px solid var(--amber-dim); border-radius:4px;
    padding:11px 13px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--panel);
  }
  .row-item .meta{font-size:11px; color:var(--text-dimmer);}
  .row-item .rho{font-family:var(--font-d); font-weight:700; font-size:16px; color:var(--text);}
  .row-item .rho small{font-weight:500; font-size:10.5px; color:var(--text-dimmer);}
  .row-actions{display:flex; gap:6px;}
  .icon-btn{
    width:30px; height:30px; border-radius:4px; border:1px solid var(--line-strong); background:var(--panel-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-dim);
  }
  .icon-btn:hover{border-color:var(--amber);}
  .empty{
    text-align:center; padding:50px 20px; color:var(--text-dimmer);
  }
  .empty svg{opacity:0.4; margin-bottom:14px; width:46px; height:46px;}
  .empty .t{font-family:var(--font-d); font-weight:600; color:var(--text-dim); margin-bottom:6px; font-size:14px;}

  /* ---- Chart / graph paper ---- */
  .chart-frame{
    background:
      linear-gradient(rgba(120,72,22,0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,72,22,0.09) 1px, transparent 1px),
      var(--panel);
    background-size:20px 20px;
    border:1px solid var(--line-strong); border-radius:6px; padding:8px; overflow:hidden;
    position:relative;
  }
  .chart-dl{
    position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:4px;
    border:1px solid var(--line-strong); background:var(--panel); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2;
  }
  .chart-dl:hover{border-color:var(--amber); color:var(--amber);}
  .chart-dl svg{width:15px; height:15px;}
  .legend{display:flex; gap:16px; font-size:11px; color:var(--text-dim); margin-top:10px;}
  .legend .sw{display:inline-flex; align-items:center; gap:6px;}
  .legend .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .legend .ln{width:14px; height:0; border-top:2px dashed var(--teal); display:inline-block;}

  /* ---- Layer stick ---- */
  .stick-wrap{display:flex; gap:14px; align-items:stretch;}
  .stick{ width:64px; border:1px solid var(--line-strong); border-radius:4px; overflow:hidden; display:flex; flex-direction:column;}
  .stick .layer{ display:flex; align-items:center; justify-content:center; font-family:var(--font-m); font-size:10px; color:#14140f; font-weight:700;}
  .stick .layer.basement{
    background-image: repeating-linear-gradient(135deg, rgba(0,0,0,0.18) 0 6px, transparent 6px 12px);
  }
  .layer-table{ flex:1; border-collapse:collapse; font-size:12px; }
  .layer-table th{ text-align:center; font-weight:600; color:var(--text-dimmer); font-size:10px; text-transform:uppercase; letter-spacing:0.3px; padding:0 0 7px 10px; border-bottom:1px solid var(--line-strong); }
  .layer-table th:first-child{ text-align:left; padding-left:0; }
  .layer-table td{ padding:8px 0 8px 10px; border-bottom:1px dashed var(--line); color:var(--text-dim); text-align:center; }
  .layer-table td:first-child{ text-align:left; padding-left:0; color:var(--text-dim); }
  .layer-table td:last-child{ color:var(--text); font-weight:600; }
  .layer-table .swatch{width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:7px;}

  .stat-grid{display:flex; gap:10px; margin:14px 0;}
  .stat{flex:1; border:1px solid var(--line); border-radius:5px; padding:10px 12px; background:var(--panel-2);}
  .stat .n{font-family:var(--font-d); font-size:20px; font-weight:700; color:var(--text);}
  .stat .l{font-size:10.5px; color:var(--text-dimmer); margin-top:2px;}

  .layer-form-row{display:grid; grid-template-columns:24px 1fr 1fr; gap:8px; align-items:center; margin-bottom:8px;}
  .layer-form-row .li-num{font-family:var(--font-d); font-weight:700; color:var(--text-dimmer); font-size:12px;}

  .spinner{
    width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,248,234,0.35); border-top-color:var(--on-amber);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{transform:rotate(360deg);} }

  /* ---- Bottom nav ---- */
  #nav{
    position:sticky; bottom:0; display:flex; border-top:1px solid var(--line);
    background:rgba(243,239,226,0.95); backdrop-filter:blur(6px); flex-shrink:0;
    padding-bottom:env(safe-area-inset-bottom);
  }
  #nav button{
    flex:1; background:none; border:none; color:var(--text-dimmer); padding:10px 2px 9px;
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
    font-family:var(--font-d); font-size:10px; font-weight:600; letter-spacing:0.1px;
  }
  #nav button svg{width:19px; height:19px;}
  #nav button.active{color:var(--amber);}
  #nav button.active svg{filter:drop-shadow(0 0 3px rgba(181,115,14,0.35));}

  /* ---- Modal ---- */
  #modal-backdrop{
    position:fixed; inset:0; background:rgba(20,16,8,0.45); display:none;
    align-items:flex-end; justify-content:center; z-index:50;
  }
  #modal-backdrop.show{display:flex;}
  #modal{
    width:100%; max-width:480px; background:var(--panel-2); border-top:1px solid var(--line-strong);
    border-radius:14px 14px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:85vh; overflow-y:auto;
  }
  #modal .close-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  #modal h3{font-family:var(--font-d); margin:0; font-size:15px;}

  ::-webkit-scrollbar{width:0; height:0;}
</style>
</head>

</script>
<div id="shell">
  <div id="topbar">
    <div class="brand"><span class="dot"></span>VES FIELD ASSISTANT</div>
    <div class="byline">Powered by Asije Labs &middot; v4.0 &middot; &copy; 2026</div>
    <div class="status-row" id="status-row"></div>
  </div>
  <div id="panel"></div>
  <div id="nav"></div>
</div>

<div id="modal-backdrop"><div id="modal"></div></div>

<script>
"use strict";

/* =========================================================================
   STATE
   ========================================================================= */
const APP_VERSION = '4.0';
const APP_COPYRIGHT = '\u00A9 2026 Asije Labs';

// Hard ceiling on the last (deepest) layer's resistivity. Capped at 20,000
// Ohm-m by design -- the optimizer will never report a deeper/basement
// resistivity above this, however steeply the tail of the field curve rises
// (equivalence lets that parameter drift arbitrarily high once it's
// saturated the curve, with no further improvement to the fit, so this cap
// is what keeps the reported value physically sane rather than a numerical
// runaway artifact).
const MAX_RES_CEILING = 20000;
const DEFAULT_RES_CEILING = MAX_RES_CEILING;

const state = {
  tab: 'setup',
  analyzeTab: 'curve',
  metadata: { project:'', station:'', geologist:'', gps:'' },
  arrayType: 'Standard Schlumberger',
  data: [],
  lastModel: null,
  editIndex: null,
  invertLayers: 3,
  designLayers: [ {rho:100, h:5}, {rho:20, h:15}, {rho:500, h:null} ],
  designIterationCount: 0,
  designIterationSnapshot: null,
  logFormValues: { 'f-ab2': '', 'f-mn2': '', 'f-r': '', 'f-rho': '' },
  logMode: 'full',
  justRestored: 0,
  resCeiling: DEFAULT_RES_CEILING,
  curveSmoothing: false,
  gpsFetching: false,
  gpsError: null,
  gpsNote: null,
};

/* =========================================================================
   SESSION PERSISTENCE (localStorage) -- so an interrupted survey (phone
   screen off, tab closed, browser crash) doesn't lose logged readings.
   This is a plain, self-contained HTML file opened directly in a real
   browser (not Claude's sandboxed artifact preview), so localStorage
   behaves normally here. Autosave is debounced and best-effort: if
   storage is unavailable (private browsing, quota exceeded, etc.) the
   app still works fully, just without the safety net.
   ========================================================================= */
const SESSION_STORAGE_KEY = 'ves_field_assistant_session_v1';
let _sessionSaveTimer = null;

function scheduleSessionSave(){
  if (_sessionSaveTimer) clearTimeout(_sessionSaveTimer);
  _sessionSaveTimer = setTimeout(saveSessionToStorage, 500);
}
function saveSessionToStorage(){
  try {
    const snapshot = {
      version: 1,
      savedAt: new Date().toISOString(),
      data: state.data,
      metadata: state.metadata,
      arrayType: state.arrayType,
      lastModel: state.lastModel,
      invertLayers: state.invertLayers,
      designLayers: state.designLayers,
      resCeiling: state.resCeiling,
    };
    window.localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(snapshot));
  } catch(e){ /* storage unavailable -- fail silently, app still works without persistence */ }
}
function loadSessionFromStorage(){
  try {
    const raw = window.localStorage.getItem(SESSION_STORAGE_KEY);
    if (!raw) return null;
    const snapshot = JSON.parse(raw);
    return (snapshot && typeof snapshot === 'object') ? snapshot : null;
  } catch(e){ return null; }
}
function clearSessionStorage(){
  try { window.localStorage.removeItem(SESSION_STORAGE_KEY); } catch(e){ /* ignore */ }
}
function restoreSessionIfAvailable(){
  const snapshot = loadSessionFromStorage();
  if (!snapshot || !Array.isArray(snapshot.data) || snapshot.data.length === 0) return false;
  state.data = snapshot.data;
  state.metadata = snapshot.metadata || state.metadata;
  state.arrayType = snapshot.arrayType || state.arrayType;
  state.lastModel = snapshot.lastModel || null;
  if (typeof snapshot.invertLayers === 'number') state.invertLayers = snapshot.invertLayers;
  if (Array.isArray(snapshot.designLayers)) state.designLayers = snapshot.designLayers;
  if (typeof snapshot.resCeiling === 'number' && snapshot.resCeiling > 0) state.resCeiling = Math.min(snapshot.resCeiling, MAX_RES_CEILING);
  state.justRestored = snapshot.data.length;
  return true;
}

const ARRAY_INFO = {
  'Standard Schlumberger': { code:'SCH', mult:1, desc:'AB/2 & MN/2 spacing, x1.0' },
  'Half-Schlumberger':     { code:'HSC', mult:2, desc:'AB/2 & MN/2 spacing, x2.0' },
};

/* =========================================================================
   GEOPHYSICS ENGINE
   Ghosh (1971) recursive resistivity transform + 28-pt "YM6" digital linear
   filter (Murakami, Zerilli & Bisdorf, 1984, USGS Open-File Report 84-280,
   public domain). Validated against the report's own reference tables.
   ========================================================================= */
const YM6_FC = [
  8.6463368e-5, -3.6875438e-4, 9.2111524e-4, -1.8772656e-3,
  3.5343506e-3, -6.4612273e-3, 1.1691267e-2, -2.1088677e-2,
  3.8045092e-2, -6.8913866e-2, 1.2666755e-1, -2.4355470e-1,
  5.2117305e-1, -1.2644217, 2.7992503, -3.4853734,
  4.1912647e-1, 1.1950174, 6.1073260e-1, 2.4298434e-1,
  8.2207576e-2, 2.7770876e-2, 8.7075202e-3, 2.8615354e-3,
  3.8399812e-4, 2.8020133e-4, 1.0060054e-4, 3.4147273e-5,
];
const YM6_F = Math.pow(10, 1/6);
const YM6_Y1 = 7.4222404;

function calcKSchlumberger(ab2, mn2){ return Math.PI * ((ab2*ab2 - mn2*mn2) / (2*mn2)); }

function resistivityTransform(res, thk, lam){
  let tt = res[res.length - 1];
  const nInterfaces = res.length - 1;
  for (let k = 1; k <= nInterfaces; k++){
    const i = nInterfaces - k;
    const refl = (res[i] - tt) / (res[i] + tt) * Math.exp(-2.0 * thk[i] * lam);
    tt = res[i] * (1.0 - refl) / (1.0 + refl);
  }
  return tt;
}

function forwardPointSchlumberger(res, thk, ab2Values){
  const out = [];
  for (const ab2 of ab2Values){
    let x = Math.exp(YM6_Y1) / ab2;
    let rr = 0.0;
    for (let j = 0; j < YM6_FC.length; j++){
      const tt = resistivityTransform(res, thk, x);
      rr += YM6_FC[j] * tt;
      x = x / YM6_F;
    }
    out.push(rr);
  }
  return out;
}

/* Forward model. The YM6 filter gives the point-limit (MN -> 0) Schlumberger
   apparent resistivity, rho_s(r). Field readings use a finite MN, and K
   (calcKSchlumberger) is the exact finite-MN factor, so the model must use the
   same geometry. When mn2Values is supplied, each reading is converted exactly:
   the potential difference over MN is the integral of the field E(r) =
   I*rho_s(r)/(2*pi*r^2) of each current electrode, so
       rho_a(L,l) = (L^2 - l^2)/(2l) * integral_{L-l}^{L+l} rho_s(r)/r^2 dr
   (3-point Gauss-Legendre; checked against the full Hankel integral to <0.05%).
   Readings with no MN/2 (direct resistivity) or a missing value stay point-limit. */
const GL3_T = [-Math.sqrt(0.6), 0, Math.sqrt(0.6)], GL3_W = [5/9, 8/9, 5/9];
function forwardModelSchlumberger(res, thk, ab2Values, mn2Values){
  if (!mn2Values) return forwardPointSchlumberger(res, thk, ab2Values);
  const radii = [], idx = [];
  ab2Values.forEach((L,i) => {
    const l = mn2Values[i];
    if (l > 0 && l < L){ idx.push(i); for (const t of GL3_T) radii.push(L + l*t); }
  });
  const rs = radii.length ? forwardPointSchlumberger(res, thk, radii) : [];
  const out = forwardPointSchlumberger(res, thk, ab2Values);
  idx.forEach((i,n) => {
    const L = ab2Values[i], l = mn2Values[i];
    let s = 0;
    for (let q = 0; q < 3; q++){ const r = radii[3*n+q]; s += GL3_W[q] * rs[3*n+q] / (r*r); }
    out[i] = (L*L - l*l) / 2 * s;
  });
  return out;
}

/* ---- Small dense linear solver: Gaussian elimination with partial pivoting ---- */
function solveLinear(Ain, bin){
  const n = bin.length;
  const A = Ain.map(row => row.slice());
  const b = bin.slice();
  for (let col = 0; col < n; col++){
    let piv = col;
    for (let r = col+1; r < n; r++) if (Math.abs(A[r][col]) > Math.abs(A[piv][col])) piv = r;
    if (Math.abs(A[piv][col]) < 1e-14) return null; // singular
    if (piv !== col){ [A[piv], A[col]] = [A[col], A[piv]]; [b[piv], b[col]] = [b[col], b[piv]]; }
    for (let r = col+1; r < n; r++){
      const f = A[r][col] / A[col][col];
      if (f === 0) continue;
      for (let c = col; c < n; c++) A[r][c] -= f * A[col][c];
      b[r] -= f * b[col];
    }
  }
  const x = new Array(n).fill(0);
  for (let r = n-1; r >= 0; r--){
    let s = b[r];
    for (let c = r+1; c < n; c++) s -= A[r][c]*x[c];
    x[r] = s / A[r][r];
  }
  return x;
}

/* ---- Numerical Jacobian (central differences) ---- */
function numericalJacobian(residualsFn, x, r0){
  const n = x.length, m = r0.length;
  const J = Array.from({length: m}, () => new Array(n).fill(0));
  for (let j = 0; j < n; j++){
    const h = Math.max(1e-6, Math.abs(x[j]) * 1e-6);
    const xp = x.slice(); xp[j] += h;
    const xm = x.slice(); xm[j] -= h;
    const rp = residualsFn(xp);
    const rm = residualsFn(xm);
    for (let i = 0; i < m; i++) J[i][j] = (rp[i] - rm[i]) / (2*h);
  }
  return J;
}

/* ---- Levenberg-Marquardt with Marquardt-scaled damping ----
   Runs in the same bounded/transformed parameter space validated below
   (sigmoid reparameterization), so the physical-bounds guarantee from the
   earlier fix carries over unchanged; only the search method improved.
   Verified against a textbook exponential-fit case (exact recovery) and
   against real VES field datasets (matches / exceeds the prior Nelder-Mead
   optimizer's results, converging far more reliably and roughly 5-10x
   faster: single runs typically resolve in well under a second). */
function levenbergMarquardt(residualsFn, x0, opts){
  opts = opts || {};
  const maxIter = opts.maxIter || 100;
  const costTol = opts.costTol || 1e-12;
  const n = x0.length;
  let x = x0.slice();
  let r = residualsFn(x);
  let cost = r.reduce((s,v)=>s+v*v, 0);
  let lambda = 1e-2;

  for (let iter = 0; iter < maxIter; iter++){
    const J = numericalJacobian(residualsFn, x, r);
    const JtJ = Array.from({length:n}, ()=> new Array(n).fill(0));
    const Jtr = new Array(n).fill(0);
    for (let a = 0; a < n; a++){
      for (let b = 0; b < n; b++){
        let s = 0;
        for (let i = 0; i < r.length; i++) s += J[i][a]*J[i][b];
        JtJ[a][b] = s;
      }
      let sr = 0;
      for (let i = 0; i < r.length; i++) sr += J[i][a]*r[i];
      Jtr[a] = sr;
    }

    let improved = false;
    for (let attempt = 0; attempt < 25; attempt++){
      const A = JtJ.map((row,a)=> row.map((v,bIdx)=> a===bIdx ? v + lambda*Math.max(v, 1e-10) : v));
      const rhs = Jtr.map(v => -v);
      const delta = solveLinear(A, rhs);
      if (!delta){ lambda *= 4; continue; }
      const xTry = x.map((v,i)=> v + delta[i]);
      const rTry = residualsFn(xTry);
      const costTry = rTry.reduce((s,v)=>s+v*v, 0);
      if (costTry < cost){
        const rel = (cost - costTry) / Math.max(cost, 1e-300);
        x = xTry; r = rTry; cost = costTry;
        lambda = Math.max(lambda / 3, 1e-12);
        improved = true;
        if (rel < costTol) return {x, cost, iters: iter};
        break;
      } else {
        lambda *= 4;
      }
    }
    if (!improved) return {x, cost, iters: iter};
  }
  return {x, cost, iters: maxIter};
}

function buildSeeds(ab2Sorted, rhoSorted, nLayers){
  const m = rhoSorted.length;
  const chunkGuess = (basementMult) => {
    const resGuess = [];
    for (let i = 0; i < nLayers; i++){
      const lo = Math.floor(i*m/nLayers), hi = Math.max(lo+1, Math.floor((i+1)*m/nLayers));
      const chunk = rhoSorted.slice(lo, hi);
      resGuess.push(Math.exp(chunk.reduce((s,v)=> s + Math.log(Math.max(v,1e-6)), 0) / chunk.length));
    }
    resGuess[resGuess.length-1] *= basementMult;
    const thkGuess = [];
    if (nLayers > 1){
      const depthMax = Math.max(...ab2Sorted) * 0.35;
      const depthMin = Math.max(ab2Sorted[0]*0.15, 0.3);
      const nT = nLayers - 1;
      let prev = 0;
      for (let i = 1; i <= nT; i++){
        const d = depthMin * Math.pow(depthMax/depthMin, i/nT);
        thkGuess.push(Math.max(d - prev, 0.1));
        prev = d;
      }
    }
    return [resGuess, thkGuess];
  };
  // Several structured starting points, not just one: a real sounding curve
  // still rising at its last spacing often hides a true basement resistivity
  // far above the last few readings (equivalence), so we seed some attempts
  // with an extrapolated-basement guess as well as the plain chunk average.
  return [chunkGuess(1), chunkGuess(5), chunkGuess(20), chunkGuess(60)];
}

function sigmoid(x){ return 1 / (1 + Math.exp(-x)); }
function logit(p){ p = Math.min(Math.max(p, 1e-9), 1-1e-9); return Math.log(p/(1-p)); }
function boundedFromParam(param, loLog, hiLog){ return Math.pow(10, loLog + (hiLog-loLog)*sigmoid(param)); }
function paramFromBounded(value, loLog, hiLog){
  const clamped = Math.min(Math.max(value, Math.pow(10, loLog+0.001)), Math.pow(10, hiLog-0.001));
  const t = (Math.log10(clamped) - loLog) / (hiLog - loLog);
  return logit(t);
}

/* Resolvability constraint for AUTO-INVERT (best-fit and smoothed).
   A surface sounding cannot resolve a layer that is thin relative to its own
   depth OR relative to its shortest electrode spacing: such a layer's effect
   on the curve is indistinguishable from its neighbours' (equivalence), so an
   unconstrained fit freely collapses extra layers into sub-metre slivers that
   fit noise rather than geology (the "4-layer collapse"). This adds a soft
   hinge penalty to the residual vector. Every finite layer must be at least
   MIN_LAYER_RATIO of its depth to top AND at least MIN_LAYER_AB2_FRACTION of
   the shortest AB/2; the penalty is zero when satisfied and grows smoothly
   as a layer gets thinner. Soft, not a hard bound, so a genuinely thin
   layer the data insists on can still appear, just no longer for free. */
const MIN_LAYER_RATIO = 0.5;
const MIN_LAYER_AB2_FRACTION = 0.5;
const RESOLVABILITY_WEIGHT = 5;
function resolvabilityPenalty(thk, minAb2){
  const out = [];
  let depthToTop = 0;
  for (let i = 0; i < thk.length; i++){
    const required = Math.max(MIN_LAYER_AB2_FRACTION * minAb2, MIN_LAYER_RATIO * depthToTop);
    out.push(RESOLVABILITY_WEIGHT * Math.max(0, Math.log10(required / thk[i])));
    depthToTop += thk[i];
  }
  return out;
}

/* IPI2Win-style field-curve smoothing (optional, off by default).
   Commercial packages such as IPI2Win and WinResist fit a smoothed copy of
   the field curve (WinResist reports its RMS "on smoothed data"), not the raw
   readings. Raw Schlumberger data carries small jumps where MN/2 is changed
   at a repeated AB/2 plus ordinary noise, and an unsmoothed fit will chase
   them. This does the same in two steps: (1) readings at the same AB/2 are
   averaged (in log space) into one point; (2) the curve is smoothed in
   log-log space with a 5-point tricube-weighted local quadratic regression,
   evaluated at the original spacings. With fewer than 5 distinct spacings
   only step 1 is applied. The fit's RMS is then measured against the
   smoothed curve; the model object also carries the RMS against the raw
   readings, so the smoothing cannot hide a poor raw fit. */
const CURVE_SMOOTH_SPAN = 5;
function smoothFieldCurve(points){
  const g = new Map();
  points.forEach(p => { if (!g.has(p.ab2)) g.set(p.ab2, []); g.get(p.ab2).push(Math.log10(p.rho)); });
  const merged = Array.from(g.keys()).sort((a,b)=>a-b).map(ab => ({
    ab2: ab, rho: Math.pow(10, g.get(ab).reduce((s,v)=>s+v,0) / g.get(ab).length)
  }));
  if (merged.length < CURVE_SMOOTH_SPAN) return merged;
  const x = merged.map(p => Math.log10(p.ab2)), y = merged.map(p => Math.log10(p.rho));
  const k = Math.min(CURVE_SMOOTH_SPAN, merged.length);
  return merged.map((p,i) => {
    const near = x.map((v,j) => [Math.abs(v - x[i]), j]).sort((a,b)=>a[0]-b[0]).slice(0,k);
    const dmax = Math.max(near[near.length-1][0], 1e-9) * 1.0001;
    const S = [[0,0,0],[0,0,0],[0,0,0]], T = [0,0,0];
    for (const [d,j] of near){
      const w = Math.pow(1 - Math.pow(d/dmax, 3), 3), dx = x[j] - x[i], b = [1, dx, dx*dx];
      for (let a = 0; a < 3; a++){ for (let c = 0; c < 3; c++) S[a][c] += w*b[a]*b[c]; T[a] += w*b[a]*y[j]; }
    }
    const sol = solveLinear(S, T);
    const v = (sol && isFinite(sol[0])) ? sol[0] : y[i];
    return { ab2: p.ab2, rho: Math.pow(10, v) };
  });
}
function attachRawFit(model, rawPoints){
  const sorted = rawPoints.slice().sort((a,b)=>a.ab2-b.ab2);
  const ab2List = sorted.map(p=>p.ab2), rhoList = sorted.map(p=>p.rho);
  const mn2List = sorted.map(p=>p.mn2);
  const predicted = forwardModelSchlumberger(model.resistivities, model.thicknesses, ab2List, mn2List);
  const sq = rhoList.map((obs,i) => Math.pow((obs-predicted[i])/obs, 2));
  model.curveSmoothed = true;
  model.rawRmsPercent = Math.sqrt(sq.reduce((a,b)=>a+b,0)/sq.length) * 100;
  model.observed = ab2List.map((x,i)=>[x, rhoList[i]]);
  model.predicted = ab2List.map((x,i)=>[x, predicted[i]]);
}

function invert1DModel(dataPoints, nLayers, restartsPerSeed=6, resCeiling=state.resCeiling){
  resCeiling = Math.min(resCeiling, MAX_RES_CEILING);
  const sorted = dataPoints.slice().sort((a,b)=>a.ab2-b.ab2);
  const ab2List = sorted.map(p=>p.ab2), rhoList = sorted.map(p=>p.rho);
  const mn2List = sorted.map(p=>p.mn2);

  const minObsRho = Math.min(...rhoList), maxObsRho = Math.max(...rhoList);
  const minAb2 = Math.min(...ab2List), maxAb2 = Math.max(...ab2List);
  // Data-adaptive but generous physical bounds. Wide enough that a genuinely
  // deep, highly resistive basement (equivalence lets these run well beyond
  // the observed curve) is still reachable; narrow enough that the optimizer
  // can no longer drift into numerical-artifact values with no physical
  // meaning (the root cause of the earlier degenerate results).
  const resLoLog = Math.log10(minObsRho) - Math.log10(50);
  const resHiLog = Math.log10(maxObsRho) + Math.log10(200);
  const deepResHiLog = Math.min(resHiLog, Math.log10(resCeiling));
  const resHiLogFor = (i) => (i === nLayers - 1) ? deepResHiLog : resHiLog;
  const thkFloor = Math.max(0.05 * minAb2, 0.15); // can't resolve thinner than this
  const thkCeil = Math.max(maxAb2, thkFloor * 10); // depth-of-investigation cap: a VES sounding cannot reliably resolve depths beyond roughly its max AB/2
  const thkLoLog = Math.log10(thkFloor), thkHiLog = Math.log10(thkCeil);

  function decode(params){
    const res = params.slice(0,nLayers).map((p,i) => boundedFromParam(p, resLoLog, resHiLogFor(i)));
    const thk = params.slice(nLayers).map(p => boundedFromParam(p, thkLoLog, thkHiLog));
    return [res, thk];
  }
  function residuals(params){
    const [res, thk] = decode(params);
    const pen = resolvabilityPenalty(thk, minAb2);
    let predicted;
    try { predicted = forwardModelSchlumberger(res, thk, ab2List, mn2List); }
    catch(e){ return ab2List.map(()=>1e6).concat(pen); }
    return rhoList.map((obs,i) => {
      const pred = predicted[i];
      if (!(pred > 0) || !isFinite(pred)) return 1e6;
      return Math.log10(obs) - Math.log10(pred);
    }).concat(pen);
  }

  const seeds = buildSeeds(ab2List, rhoList, nLayers);
  let best = null;
  for (const [resGuess, thkGuess] of seeds){
    const baseX0 = resGuess.map((r,i) => paramFromBounded(r, resLoLog, resHiLogFor(i)))
      .concat(thkGuess.map(t => paramFromBounded(t, thkLoLog, thkHiLog)));
    for (let attempt = 0; attempt < restartsPerSeed; attempt++){
      const x0 = attempt === 0 ? baseX0 : baseX0.map(v => v + (Math.random()*1.6 - 0.8));
      const cand = levenbergMarquardt(residuals, x0, {maxIter: 100});
      if (!best || cand.cost < best.cost) best = cand;
    }
  }
  const [finalRes, finalThk] = decode(best.x);
  const predicted = forwardModelSchlumberger(finalRes, finalThk, ab2List, mn2List);
  const sqPct = rhoList.map((obs,i)=> Math.pow((obs-predicted[i])/obs, 2));
  const rmsPercent = Math.sqrt(sqPct.reduce((a,b)=>a+b,0)/sqPct.length) * 100;

  const depths = []; let running = 0;
  for (const t of finalThk){ running += t; depths.push(running); }

  return {
    nLayers, resistivities: finalRes, thicknesses: finalThk, depths, rmsPercent,
    observed: ab2List.map((x,i)=>[x, rhoList[i]]),
    predicted: ab2List.map((x,i)=>[x, predicted[i]]),
  };
}

/* =========================================================================
   ADAPTIVE OCCAM-STYLE SMOOTHED INVERSION (discrepancy principle)
   ---------------------------------------------------------------------
   A second, distinct fitting philosophy offered alongside the best-fit
   result above -- never silently replacing it. Rather than the single
   best fit to the raw data (which can chase small non-geological wiggles
   into an unrealistically thin, extreme layer), this searches for the
   SMOOTHEST model whose fit is still within a bounded, data-adaptive
   tolerance of that best-fit's own achievable misfit.

   The tolerance is tied to the data's own best achievable fit rather than
   a fixed constant: when the data already supports an exact, unambiguous
   fit (clean or lightly-noisy data), the tolerance shrinks to ~0 and this
   reduces to the ordinary best-fit result. Regularization only engages
   when the raw best fit itself requires an unstable, extreme configuration
   to achieve -- exactly the failure mode this was built to address.

   Verified: preserves exact recovery on clean synthetic data regardless of
   relaxation factor (baseline cost ~0 forces near-zero smoothing). On real
   field data with a drilled-borehole ground truth, it moved a badly wrong
   result (1.3 m apparent overburden) to within ~2% of the true depth
   (17.3 m vs. ~17 m drilled). But on a different real dataset it pushed
   the model further from the best available cross-check (another
   inversion package's result) rather than closer -- so this is offered as
   a second, clearly-labeled lens for comparison, not a replacement. Which
   of the two is closer to the truth at a given site is a judgment call the
   app cannot make on its own; local geological knowledge (a nearby
   borehole, known stratigraphy) is what actually resolves it.
   ========================================================================= */
function adaptiveSmoothFromBaseline(dataResidualsFn, decodeFn, baselineX, baselineCost, relaxationFactor){
  function dataCostOf(params){ return dataResidualsFn(params).reduce((s,v)=>s+v*v, 0); }
  function fullResiduals(params, mu){
    const [res] = decodeFn(params);
    const rough = [];
    for (let i = 0; i < res.length - 1; i++) rough.push(Math.sqrt(mu) * (Math.log10(res[i+1]) - Math.log10(res[i])));
    return dataResidualsFn(params).concat(rough);
  }
  const targetCost = baselineCost * relaxationFactor + 1e-10;
  let curX = baselineX, curMu = 0;
  let lastGood = { x: curX, mu: 0 };
  let overshootMu = null;
  for (let iter = 0; iter < 40; iter++){
    const mu = curMu === 0 ? 1e-6 : curMu * 2;
    const cand = levenbergMarquardt(p => fullResiduals(p, mu), curX, {maxIter: 100});
    if (dataCostOf(cand.x) <= targetCost){
      lastGood = { x: cand.x, mu };
      curX = cand.x; curMu = mu;
    } else {
      overshootMu = mu;
      break;
    }
  }
  if (overshootMu){
    let loMu = lastGood.mu || 1e-7, hiMu = overshootMu, bestX = lastGood.x;
    for (let b = 0; b < 14; b++){
      const midMu = Math.sqrt(loMu * hiMu);
      const cand = levenbergMarquardt(p => fullResiduals(p, midMu), bestX, {maxIter: 80});
      if (dataCostOf(cand.x) <= targetCost){ bestX = cand.x; loMu = midMu; }
      else hiMu = midMu;
    }
    lastGood = { x: bestX, mu: loMu };
  }
  return lastGood.x;
}
function invert1DModelSmoothed(dataPoints, nLayers, opts){
  opts = opts || {};
  const restartsPerSeed = opts.restartsPerSeed || 6;
  const relaxationFactor = opts.relaxationFactor || 1.3;
  const resCeiling = Math.min(opts.resCeiling || state.resCeiling, MAX_RES_CEILING);

  const sorted = dataPoints.slice().sort((a,b)=>a.ab2-b.ab2);
  const ab2List = sorted.map(p=>p.ab2), rhoList = sorted.map(p=>p.rho);
  const mn2List = sorted.map(p=>p.mn2);

  const minObsRho = Math.min(...rhoList), maxObsRho = Math.max(...rhoList);
  const minAb2 = Math.min(...ab2List), maxAb2 = Math.max(...ab2List);
  const resLoLog = Math.log10(minObsRho) - Math.log10(50);
  const resHiLog = Math.log10(maxObsRho) + Math.log10(200);
  const deepResHiLog = Math.min(resHiLog, Math.log10(resCeiling));
  const resHiLogFor = (i) => (i === nLayers - 1) ? deepResHiLog : resHiLog;
  const thkFloor = Math.max(0.05 * minAb2, 0.15);
  const thkCeil = Math.max(maxAb2, thkFloor * 10);
  const thkLoLog = Math.log10(thkFloor), thkHiLog = Math.log10(thkCeil);

  function decode(params){
    return [ params.slice(0,nLayers).map((p,i) => boundedFromParam(p, resLoLog, resHiLogFor(i))),
             params.slice(nLayers).map(p => boundedFromParam(p, thkLoLog, thkHiLog)) ];
  }
  function dataResiduals(params){
    const [res, thk] = decode(params);
    const pen = resolvabilityPenalty(thk, minAb2);
    let predicted;
    try { predicted = forwardModelSchlumberger(res, thk, ab2List, mn2List); }
    catch(e){ return ab2List.map(()=>1e3).concat(pen); }
    return rhoList.map((obs,i) => {
      const pred = predicted[i];
      if (!(pred > 0) || !isFinite(pred)) return 1e3;
      return Math.log10(obs) - Math.log10(pred);
    }).concat(pen);
  }

  const seeds = buildSeeds(ab2List, rhoList, nLayers);
  let baseline = null;
  for (const [resGuess, thkGuess] of seeds){
    const baseX0 = resGuess.map((r,i) => paramFromBounded(r, resLoLog, resHiLogFor(i)))
      .concat(thkGuess.map(t => paramFromBounded(t, thkLoLog, thkHiLog)));
    for (let attempt = 0; attempt < restartsPerSeed; attempt++){
      const x0 = attempt === 0 ? baseX0 : baseX0.map(v => v + (Math.random()*1.6 - 0.8));
      const cand = levenbergMarquardt(dataResiduals, x0, {maxIter: 100});
      if (!baseline || cand.cost < baseline.cost) baseline = cand;
    }
  }

  const finalX = adaptiveSmoothFromBaseline(dataResiduals, decode, baseline.x, baseline.cost, relaxationFactor);
  const [finalRes, finalThk] = decode(finalX);
  const predicted = forwardModelSchlumberger(finalRes, finalThk, ab2List, mn2List);
  const sqPct = rhoList.map((obs,i)=> Math.pow((obs-predicted[i])/obs, 2));
  const rmsPercent = Math.sqrt(sqPct.reduce((a,b)=>a+b,0)/sqPct.length) * 100;
  const depths = []; let running = 0;
  for (const t of finalThk){ running += t; depths.push(running); }

  return {
    nLayers, resistivities: finalRes, thicknesses: finalThk, depths, rmsPercent,
    observed: ab2List.map((x,i)=>[x, rhoList[i]]),
    predicted: ab2List.map((x,i)=>[x, predicted[i]]),
  };
}

/* =========================================================================
   CHART BUILDER (log-log, graph-paper styled SVG)
   ========================================================================= */
function niceLogBounds(vals){
  const lo = Math.min(...vals), hi = Math.max(...vals);
  let loE = Math.floor(Math.log10(lo));
  let hiE = Math.ceil(Math.log10(hi));
  if (hiE <= loE) hiE = loE + 1;
  return [loE, hiE];
}
function fmtPow(v){
  // Always a plain full number (e.g. 10000, never 1e4)
  const n = Number(v.toPrecision(3));
  return n >= 1 ? String(Math.round(n)) : n.toFixed(Math.min(6, Math.max(1, -Math.floor(Math.log10(n))))).replace(/0+$/,'');
}
function buildLogLogChart(seriesList, opts){
  opts = opts || {};
  const W = opts.width || 400, H = opts.height || 272;
  const padL = 54, padR = 12, padT = 10, padB = 38;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  let allX = [], allY = [];
  seriesList.forEach(s => s.points.forEach(p => { allX.push(p[0]); allY.push(p[1]); }));
  if (!allX.length) return '<div class="empty"><div class="t">Nothing to plot yet</div></div>';
  const [xLoE, xHiE] = niceLogBounds(allX);
  const [yLoE, yHiE] = niceLogBounds(allY);
  const xScale = v => padL + ((Math.log10(v) - xLoE) / (xHiE - xLoE)) * plotW;
  const yScale = v => padT + plotH - ((Math.log10(v) - yLoE) / (yHiE - yLoE)) * plotH;

  let grid = '';
  for (let e = xLoE; e <= xHiE; e++){
    for (let m = 1; m <= 9; m++){
      if (e === xHiE && m > 1) break;
      const v = m * Math.pow(10, e);
      const x = xScale(v), major = m === 1;
      grid += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${padT+plotH}" stroke="${major?'rgba(120,72,22,0.45)':'rgba(120,72,22,0.15)'}" stroke-width="${major?1:0.5}"/>`;
      if (major) grid += `<text x="${x.toFixed(1)}" y="${padT+plotH+14}" font-size="8.5" fill="#7a715f" text-anchor="middle" font-family="JetBrains Mono">${fmtPow(v)}</text>`;
    }
  }
  for (let e = yLoE; e <= yHiE; e++){
    for (let m = 1; m <= 9; m++){
      if (e === yHiE && m > 1) break;
      const v = m * Math.pow(10, e);
      const y = yScale(v), major = m === 1;
      grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${padL+plotW}" y2="${y.toFixed(1)}" stroke="${major?'rgba(120,72,22,0.45)':'rgba(120,72,22,0.15)'}" stroke-width="${major?1:0.5}"/>`;
      if (major) grid += `<text x="${padL-5}" y="${(y+2.8).toFixed(1)}" font-size="8.5" fill="#7a715f" text-anchor="end" font-family="JetBrains Mono">${fmtPow(v)}</text>`;
    }
  }

  let seriesSvg = '';
  seriesList.forEach(s => {
    const pts = s.points.slice().sort((a,b)=>a[0]-b[0]);
    if (s.style === 'line'){
      const d = pts.map((p,i)=> `${i===0?'M':'L'}${xScale(p[0]).toFixed(1)},${yScale(p[1]).toFixed(1)}`).join(' ');
      const dash = s.dashArray || (s.dashed ? '4,3' : 'none');
      seriesSvg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.strokeWidth || 1.6}" stroke-dasharray="${dash}"/>`;
    } else {
      pts.forEach(p => {
        seriesSvg += `<circle cx="${xScale(p[0]).toFixed(1)}" cy="${yScale(p[1]).toFixed(1)}" r="3.2" fill="${s.color}" stroke="#ffffff" stroke-width="0.9"/>`;
      });
    }
  });

  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="display:block; width:100%; height:auto;"><rect width="${W}" height="${H}" fill="#ffffff"/>${grid}${seriesSvg}
    <rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="none" stroke="rgba(120,72,22,0.55)" stroke-width="1"/>
    <text x="${(padL+plotW/2).toFixed(1)}" y="${H-5}" font-size="10" font-weight="700" fill="#332f28" text-anchor="middle" font-family="JetBrains Mono">${opts.xLabel || 'AB/2 (m)'}</text>
    <text transform="translate(11,${(padT+plotH/2).toFixed(1)}) rotate(-90)" font-size="10" font-weight="700" fill="#332f28" text-anchor="middle" font-family="JetBrains Mono">${opts.yLabel || 'Apparent resistivity (\u03A9\u00B7m)'}</text>
  </svg>`;
}

/* Builds the "block model" step function VES practitioners overlay on the
   sounding curve (as seen in WinResist/IPI2Win): a staircase of the layer
   model's own resistivities plotted against depth, on the same log-x axis
   as the apparent-resistivity curve. Not a physically identical quantity to
   apparent resistivity (it's true resistivity vs. depth, not apparent
   resistivity vs. AB/2), but this overlay is the standard VES convention
   for visually comparing the interpreted layers against the field curve. */
function buildLayerStaircase(model, ab2List){
  const minAb2 = Math.min(...ab2List), maxAb2 = Math.max(...ab2List);
  // The left extension must sit at or below the SMALLEST layer boundary,
  // not just below the smallest AB/2 reading: a thin near-surface layer's
  // own depth can be smaller than the shallowest spacing used, and starting
  // the staircase to the right of that boundary made its first segment
  // run backwards (large x to small x) before turning around -- the exact
  // "glitch" this was built to fix. Snapping to exact log-decade boundaries
  // (rather than an arbitrary multiplier) is also what makes the staircase
  // touch the chart's own axis edges exactly, since the axis itself is
  // computed the same way, and it avoids needlessly widening the plotted
  // range beyond what the data requires.
  const smallestBoundary = model.depths.length ? model.depths[0] : minAb2;
  const leftBound = Math.min(minAb2, smallestBoundary);
  const leftX = Math.pow(10, Math.floor(Math.log10(leftBound)));
  const rightX = Math.pow(10, Math.ceil(Math.log10(maxAb2)));
  const pts = [];
  let xStart = leftX;
  for (let i = 0; i < model.nLayers; i++){
    const isLast = i === model.nLayers - 1;
    const xEnd = isLast ? rightX : model.depths[i];
    if (pts.length === 0) pts.push([xStart, model.resistivities[i]]);
    pts.push([xEnd, model.resistivities[i]]);
    if (!isLast) pts.push([xEnd, model.resistivities[i+1]]);
    xStart = xEnd;
  }
  return pts;
}

/* =========================================================================
   IMAGE DOWNLOAD (charts + model diagram, rendered SVG -> PNG via canvas)
   ========================================================================= */
function svgStringToPngDownload(svgString, filename){
  if (!svgString.includes('xmlns=')) svgString = svgString.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  // Require a tag-boundary or whitespace before "width="/"height=" so this
  // never matches inside an unrelated attribute like stroke-width="...".
  const widthMatch = svgString.match(/[\s<]width="([\d.]+)"/);
  const heightMatch = svgString.match(/[\s<]height="([\d.]+)"/);
  const w = widthMatch ? parseFloat(widthMatch[1]) : 400;
  const h = heightMatch ? parseFloat(heightMatch[1]) : 250;
  const svgBlob = new Blob([svgString], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = function(){
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = w * scale; canvas.height = h * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    canvas.toBlob(function(blob){
      const dlUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = dlUrl; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(dlUrl);
    }, 'image/png');
  };
  img.onerror = function(){ URL.revokeObjectURL(url); };
  img.src = url;
}
function downloadChartFrame(containerId, filename){
  // Direct-child selector: the container also holds the small download-icon
  // <svg> nested inside .chart-dl, which a plain descendant selector would
  // match first (it's earlier in the DOM) and grab the wrong dimensions from.
  const svgEl = document.querySelector(`#${containerId} > svg`);
  if (!svgEl) return;
  svgStringToPngDownload(svgEl.outerHTML, filename);
}
function stationSlug(){ return (state.metadata.station || 'station').replace(/\s+/g, '_'); }

/* =========================================================================
   LAYER STICK VISUAL
   ========================================================================= */
function resistivityColor(rho, minLog, maxLog){
  const stops = [ [0.0,[62,124,116]], [0.35,[138,171,92]], [0.65,[232,163,61]], [1.0,[178,58,46]] ];
  const t = maxLog === minLog ? 0.5 : (Math.log10(rho) - minLog) / (maxLog - minLog);
  const tc = Math.max(0, Math.min(1, t));
  let c0 = stops[0], c1 = stops[stops.length-1];
  for (let i = 0; i < stops.length-1; i++){
    if (tc >= stops[i][0] && tc <= stops[i+1][0]){ c0 = stops[i]; c1 = stops[i+1]; break; }
  }
  const span = (c1[0]-c0[0]) || 1;
  const lt = (tc - c0[0]) / span;
  const rgb = c0[1].map((v,i)=> Math.round(v + (c1[1][i]-v)*lt));
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}
function renderLayerStick(model){
  const res = model.resistivities, thk = model.thicknesses;
  const logs = res.map(r=>Math.log10(Math.max(r,1e-3)));
  const minLog = Math.min(...logs), maxLog = Math.max(...logs);
  const totalFiniteThk = thk.reduce((a,b)=>a+b,0) || 1;
  let stickHtml = '', rowsHtml = '';
  for (let i = 0; i < model.nLayers; i++){
    const color = resistivityColor(res[i], minLog, maxLog);
    const isLast = i === model.nLayers - 1;
    const h = isLast ? 56 : Math.max(20, (thk[i]/totalFiniteThk) * 150);
    stickHtml += `<div class="layer${isLast?' basement':''}" style="height:${h.toFixed(0)}px; background:${color};"></div>`;
    const thickCell = isLast ? '\u221E' : thk[i].toFixed(1);
    const depthCell = isLast ? '\u2014' : model.depths[i].toFixed(1);
    rowsHtml += `<tr><td><span class="swatch" style="background:${color}"></span>${i+1}</td><td>${thickCell}</td><td>${depthCell}</td><td>${res[i].toFixed(1)}</td></tr>`;
  }
  const tableHtml = `
    <table class="layer-table">
      <thead><tr><th>Layer</th><th>Layer thickness (m)</th><th>Depth (m)</th><th>Resistivity (\u03A9\u00B7m)</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
  return `<div class="stick-wrap"><div class="stick">${stickHtml}</div>${tableHtml}</div>`;
}

function buildModelSummarySvg(model){
  const res = model.resistivities, thk = model.thicknesses;
  const logs = res.map(r=>Math.log10(Math.max(r,1e-3)));
  const minLog = Math.min(...logs), maxLog = Math.max(...logs);
  const totalFiniteThk = thk.reduce((a,b)=>a+b,0) || 1;

  const W = 720, pad = 24, headerH = 56, footerH = 36;
  const stickX = pad, stickW = 100, stickGap = 6;
  const availableStickHeight = 176, basementHeight = 64;
  const tableX = stickX + stickW + 24, tableW = W - tableX - pad;
  const theadH = 28, rowH = 40;

  // left-hand stacked stick (same proportions/colors as the on-screen layer stick)
  let stickRows = '', sy = headerH;
  for (let i = 0; i < model.nLayers; i++){
    const isLast = i === model.nLayers - 1;
    const h = isLast ? basementHeight : Math.max(18, (thk[i]/totalFiniteThk) * availableStickHeight);
    const color = resistivityColor(res[i], minLog, maxLog);
    stickRows += `<rect x="${stickX}" y="${sy.toFixed(1)}" width="${stickW}" height="${h.toFixed(1)}" fill="${color}" stroke="#332f28" stroke-width="0.6"/>`;
    if (isLast){
      stickRows += `<rect x="${stickX}" y="${sy.toFixed(1)}" width="${stickW}" height="${h.toFixed(1)}" fill="url(#hatch)"/>`;
    }
    sy += h + stickGap;
  }
  const stickBottom = sy - stickGap;

  // right-hand tabulated layer data, matching the on-screen layer table
  const colLayer = tableX, colThick = tableX + tableW*0.42, colDepth = tableX + tableW*0.66, colRes = tableX + tableW;
  let tableHead = `
    <text x="${colLayer.toFixed(1)}" y="${(headerH+18).toFixed(1)}" font-size="10" font-weight="700" fill="#a89d89" font-family="JetBrains Mono" letter-spacing="0.5">LAYER</text>
    <text x="${colThick.toFixed(1)}" y="${(headerH+18).toFixed(1)}" font-size="10" font-weight="700" fill="#a89d89" font-family="JetBrains Mono" text-anchor="middle" letter-spacing="0.5">THICKNESS (M)</text>
    <text x="${colDepth.toFixed(1)}" y="${(headerH+18).toFixed(1)}" font-size="10" font-weight="700" fill="#a89d89" font-family="JetBrains Mono" text-anchor="middle" letter-spacing="0.5">DEPTH (M)</text>
    <text x="${colRes.toFixed(1)}" y="${(headerH+18).toFixed(1)}" font-size="10" font-weight="700" fill="#a89d89" font-family="JetBrains Mono" text-anchor="end" letter-spacing="0.5">RESISTIVITY (\u03A9\u00B7M)</text>
    <line x1="${tableX}" y1="${(headerH+theadH).toFixed(1)}" x2="${(tableX+tableW).toFixed(1)}" y2="${(headerH+theadH).toFixed(1)}" stroke="#d8cdb8" stroke-width="1"/>`;

  let tableRows = '', ty = headerH + theadH;
  for (let i = 0; i < model.nLayers; i++){
    const isLast = i === model.nLayers - 1;
    const color = resistivityColor(res[i], minLog, maxLog);
    const thickCell = isLast ? '\u221E' : thk[i].toFixed(1);
    const depthCell = isLast ? '\u2014' : model.depths[i].toFixed(1);
    const midY = ty + rowH/2;
    if (i > 0){
      tableRows += `<line x1="${tableX}" y1="${ty.toFixed(1)}" x2="${(tableX+tableW).toFixed(1)}" y2="${ty.toFixed(1)}" stroke="#e7ded0" stroke-width="1" stroke-dasharray="2,2"/>`;
    }
    tableRows += `<rect x="${colLayer.toFixed(1)}" y="${(midY-5).toFixed(1)}" width="9" height="9" rx="2" fill="${color}" stroke="#332f28" stroke-width="0.5"/>`;
    tableRows += `<text x="${(colLayer+16).toFixed(1)}" y="${(midY+4).toFixed(1)}" font-size="12" fill="#76695c" font-family="JetBrains Mono">${i+1}</text>`;
    tableRows += `<text x="${colThick.toFixed(1)}" y="${(midY+4).toFixed(1)}" font-size="12" fill="#76695c" font-family="JetBrains Mono" text-anchor="middle">${thickCell}</text>`;
    tableRows += `<text x="${colDepth.toFixed(1)}" y="${(midY+4).toFixed(1)}" font-size="12" fill="#76695c" font-family="JetBrains Mono" text-anchor="middle">${depthCell}</text>`;
    tableRows += `<text x="${colRes.toFixed(1)}" y="${(midY+4).toFixed(1)}" font-size="12" font-weight="700" fill="#332f28" font-family="JetBrains Mono" text-anchor="end">${res[i].toFixed(1)}</text>`;
    ty += rowH;
  }
  const tableBottom = ty;
  const contentBottom = Math.max(stickBottom, tableBottom);

  // RMS misfit / layer-count stat boxes, matching the on-screen stat grid
  const showStats = model.source === 'invert' || model.refined;
  let statsHtml = '', afterStatsY = contentBottom + 14;
  if (showStats){
    const statY = contentBottom + 18, statH = 54, statGap = 12;
    const statW = (W - 2*pad - statGap) / 2;
    const stat2X = pad + statW + statGap;
    statsHtml = `
      <rect x="${pad}" y="${statY.toFixed(1)}" width="${statW.toFixed(1)}" height="${statH}" rx="5" fill="#f3efe4" stroke="#e7ded0" stroke-width="1"/>
      <text x="${(pad+14).toFixed(1)}" y="${(statY+25).toFixed(1)}" font-size="18" font-weight="700" fill="#332f28" font-family="Space Grotesk">${model.rmsPercent.toFixed(1)}%</text>
      <text x="${(pad+14).toFixed(1)}" y="${(statY+41).toFixed(1)}" font-size="10" fill="#a89d89" font-family="JetBrains Mono">RMS misfit${model.curveSmoothed ? ' (smoothed curve)' : ''}</text>
      <rect x="${stat2X.toFixed(1)}" y="${statY.toFixed(1)}" width="${statW.toFixed(1)}" height="${statH}" rx="5" fill="#f3efe4" stroke="#e7ded0" stroke-width="1"/>
      <text x="${(stat2X+14).toFixed(1)}" y="${(statY+25).toFixed(1)}" font-size="18" font-weight="700" fill="#332f28" font-family="Space Grotesk">${model.nLayers}</text>
      <text x="${(stat2X+14).toFixed(1)}" y="${(statY+41).toFixed(1)}" font-size="10" fill="#a89d89" font-family="JetBrains Mono">Layers</text>`;
    afterStatsY = statY + statH + 14;
  }

  const H = afterStatsY + footerH - 14;

  const title = `Interpreted 1D Earth Model${state.metadata.station ? ' \u2014 ' + state.metadata.station : ''}`;
  const subtitle = model.source === 'invert' ? `${model.nLayers} layers \u00B7 RMS misfit ${model.rmsPercent.toFixed(2)}%${model.curveSmoothed ? ' (smoothed curve; raw ' + model.rawRmsPercent.toFixed(2) + '%)' : ''}` : `${model.nLayers} layers \u00B7 designed model`;

  // NOTE: this string is loaded into an <img> as image/svg+xml, which parses
  // as strict XML -- only the five predefined XML entities are valid there,
  // so text content must use literal unicode characters (e.g. \u00B7), never
  // HTML-only named entities like &middot; (those silently fail img.onload
  // with no visible error, which is why this used to look like a dead button).
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
    <defs><pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(0,0,0,0.22)" stroke-width="3"/></pattern></defs>
    <rect width="${W}" height="${H}" fill="#ffffff"/>
    <text x="${pad}" y="28" font-size="15" font-weight="700" fill="#332f28" font-family="Space Grotesk">${title}</text>
    <text x="${pad}" y="44" font-size="11" fill="#a89d89" font-family="JetBrains Mono">${subtitle}</text>
    ${stickRows}
    ${tableHead}
    ${tableRows}
    ${statsHtml}
    <text x="${pad}" y="${(H-12).toFixed(1)}" font-size="10" fill="#a89d89" font-family="JetBrains Mono">VES Field Assistant v${APP_VERSION} \u00B7 Powered by Asije Labs</text>
  </svg>`;
}

   VIEW: SETUP
   ========================================================================= */
/* =========================================================================
   LOCATION (Geolocation API) -- pulls the device's current GPS coordinates
   into the survey metadata on request.

   Important scope note: this does not require an internet connection in
   the sense of network signal at the survey site -- most phones can get a
   GPS fix purely from satellites, offline, once they have a clear view of
   the sky. What it DOES require is that this page be loaded from a secure
   context (an https:// address, or localhost) -- browsers block the
   Geolocation API entirely on insecure origins such as a file opened
   directly from disk or through Android's content:// file picker. If the
   button below does nothing or errors immediately, that is almost
   certainly why -- see the error message it shows for what to do about it.
   ========================================================================= */
function acquireLocation(){
  if (!navigator.geolocation){
    state.gpsError = 'Location access is not available in this browser.';
    render();
    return;
  }
  state.gpsFetching = true;
  state.gpsError = null;
  state.gpsNote = null;
  render();
  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude.toFixed(6);
      const lng = position.coords.longitude.toFixed(6);
      state.metadata.gps = `Lat: ${lat}, Long: ${lng}`;
      state.gpsFetching = false;
      state.gpsError = null;
      state.gpsNote = `Accuracy: \u00B1${Math.round(position.coords.accuracy)}m`;
      render();
    },
    (error) => {
      state.gpsFetching = false;
      let msg = 'Could not get your location.';
      if (error.code === error.PERMISSION_DENIED){
        msg = 'Location permission was denied. If this page was opened as a local file (not a proper https:// or localhost address), the browser may be blocking location access entirely regardless of permission. Otherwise, check your browser\u2019s site settings for this page and allow location access, then try again.';
      } else if (error.code === error.POSITION_UNAVAILABLE){
        msg = 'Location unavailable \u2014 try moving to a spot with a clearer view of the sky, then try again.';
      } else if (error.code === error.TIMEOUT){
        msg = 'Location request timed out \u2014 try again.';
      }
      state.gpsError = msg;
      render();
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// Parses the "Lat: X, Long: Y" format this app stores GPS coordinates in.
// The "Lat:"/"Long:" prefixes are optional and case-insensitive -- older
// sessions saved before this format was added used a bare "X, Y", and that
// still parses correctly so existing saved stations keep working. Returns
// {lat, lng} or null if the string isn't in a recognizable form.
function parseGpsString(gpsStr){
  if (!gpsStr) return null;
  const match = gpsStr.trim().match(/^(?:lat\.?:?\s*)?(-?\d+(?:\.\d+)?)\s*,\s*(?:lon(?:g)?\.?:?\s*|lng:?\s*)?(-?\d+(?:\.\d+)?)$/i);
  if (!match) return null;
  const lat = parseFloat(match[1]), lng = parseFloat(match[2]);
  if (isNaN(lat) || isNaN(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return { lat, lng };
}

function viewSetup(){
  const opts = Object.keys(ARRAY_INFO);
  return `
    <div class="section-title">Survey setup</div>
    <div class="section-sub">Station details and electrode array configuration for this sounding.</div>

      ? "For data where apparent resistivity is already known (a prior survey, another instrument, a digitized record) and the raw resistance/MN\u20442 behind it isn't available."

        oninput="state.logFormValues['f-r']=this.value">
      `}

function submitReading(){
  logError = '';
  const info = ARRAY_INFO[state.arrayType];
  try {
    const ab2 = parseFloat(el('f-ab2').value);
    if (isNaN(ab2)) throw new Error('Enter a valid AB/2 value.');

    let mn2 = null, r = null, k = null, rho;
    if (state.logMode === 'resistivity'){
      rho = parseFloat(el('f-rho').value);
      if (isNaN(rho)) throw new Error('Enter a valid resistivity value.');
      if (rho <= 0) throw new Error('Resistivity must be a positive number.');
    } else {
      mn2 = parseFloat(el('f-mn2').value);
      r = parseFloat(el('f-r').value);
      if (isNaN(mn2) || isNaN(r)) throw new Error('Enter valid numeric values.');
      if (ab2 <= mn2) throw new Error("Geometry violation: AB/2 must be greater than MN/2.");
      k = calcKSchlumberger(ab2, mn2);
      rho = r * k * info.mult;
    }

    if (state.data.length > 0){
      const lastAb2 = state.data[state.data.length - 1].ab2;
      if (ab2 < lastAb2){
        throw new Error(`Out-of-sequence spacing: the last logged reading was AB/2=${lastAb2}m, and this one is AB/2=${ab2}m. Sounding readings must be logged in non-decreasing AB/2 order \u2014 check the field notebook and re-enter, or edit the previous point on the Data tab if it was a mistake. (Equal AB/2 is fine for an overlap/check reading at a different MN/2.)`);
      }
    }
    state.data.push({array: state.arrayType, ab2, mn2, r, k, rho});
    state.logFormValues = { 'f-ab2': '', 'f-mn2': '', 'f-r': '', 'f-rho': '' };
    render();
  } catch(e){
    logError = e.message;
    render();
  }
}

// Flags a sustained deceleration or reversal in the observed curve's rate of
// climb toward basement -- a pattern experienced VES practitioners associate
// with a fracture or partial weathering zone within otherwise more resistive
// basement, which a smooth layered fit can average over without surfacing.
// This looks at the RAW OBSERVED data only, never the fitted model, since
// the point is to flag something the field curve itself is showing.
//
// Scans the WHOLE limb rather than just the last interval: it finds the
// steepest established rise anywhere in the curve, then scans forward from
// there for the first interval that falls well below that rate (or reverses
// outright) -- that is the true onset, which can sit well before the final
// spacing. The flagged zone is only reported if the suppression PERSISTS to
// the last reading; a dip that recovers into a strong climb afterward is
// ordinary curve wobble, not a disrupted basement limb, and isn't flagged.
function detectTailDeceleration(observed){
  const grouped = {};
  observed.forEach(([ab2, rho]) => {
    if (!grouped[ab2]) grouped[ab2] = [];
    grouped[ab2].push(rho);
  });
  const points = Object.keys(grouped).map(Number).sort((a,b)=>a-b)
    .map(ab2 => [ab2, grouped[ab2].reduce((a,b)=>a+b,0)/grouped[ab2].length]);

  if (points.length < 5) return null;

  const slopes = [];
  for (let i = 1; i < points.length; i++){
    const [a0,r0] = points[i-1], [a1,r1] = points[i];
    slopes.push((Math.log10(r1)-Math.log10(r0)) / (Math.log10(a1)-Math.log10(a0)));
  }

  const peakSlope = Math.max(...slopes);
  if (peakSlope <= 0) return null;
  const peakIdx = slopes.indexOf(peakSlope);

  const ONSET_RATIO = 0.35;   // how suppressed a slope must be to start the flagged zone
  const PERSIST_RATIO = 0.5;  // how suppressed every slope after onset must stay

  let onsetIdx = -1;
  for (let i = peakIdx + 1; i < slopes.length; i++){
    if (slopes[i] < ONSET_RATIO * peakSlope){ onsetIdx = i; break; }
  }
  if (onsetIdx === -1) return null;

  for (let i = onsetIdx; i < slopes.length; i++){
    if (slopes[i] >= PERSIST_RATIO * peakSlope) return null;
  }

  return { onsetAb2: points[onsetIdx][0], lastAb2: points[points.length-1][0] };
}
function tailDecelerationNoteHtml(model){
  if (!model.observed || model.observed.length < 5) return '';
  const decel = detectTailDeceleration(model.observed);
  if (!decel) return '';
  const span = decel.onsetAb2 === decel.lastAb2 ? `AB/2=${decel.lastAb2}m` : `AB/2=${decel.onsetAb2}m through your widest spacing (${decel.lastAb2}m)`;
  return `<div class="alert info">${ICONS.bolt}<div>Your field curve's rate of rise flattens or reverses across ${span}. That pattern can indicate a fracture or partial weathering zone within otherwise more resistive basement, rather than confirming solid, unfractured rock \u2014 a high inverted basement resistivity alone doesn't rule this out, since a smooth layered fit can average over it. Worth weighing before deciding against further investigation on this basis alone.</div></div>`;
}

function viewInvert(){
  if (state.data.length < 4){
    return `<div class="alert err">${ICONS.close}<div>Need at least 4 logged readings to invert a reliable model (have ${state.data.length}).</div></div>`;
  }
  const maxLayers = Math.min(6, Math.floor(state.data.length/2) + 1);
  if (state.invertLayers > maxLayers) state.invertLayers = maxLayers;
  if (state.invertLayers < 2) state.invertLayers = 2;
  if (!state.invertMethod) state.invertMethod = 'bestfit';

  let resultHtml = '';
  if (state.lastModel && state.lastModel.source === 'invert'){
    const m = state.lastModel;
    const fitClass = m.rmsPercent < 5 ? 'ok' : m.rmsPercent < 12 ? 'info' : 'err';
    const fitWord = m.rmsPercent < 5 ? 'Excellent fit' : m.rmsPercent < 12 ? 'Reasonable fit' : 'High misfit \u2014 try a different layer count';
    const isSmoothed = m.method === 'smoothed';
    resultHtml = `
      <div class="divider"></div>
      <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span>${isSmoothed ? 'Smoothed model (Occam-style)' : 'Best-fit model'}</span>
        <div class="icon-btn" onclick="downloadModelImage(state.lastModel)">${ICONS.download}</div>
      </div>
      ${isSmoothed ? `<div class="alert info">${ICONS.bolt}<div>This trades some raw fit quality for a smoother layer sequence \u2014 it is not automatically more correct. Compare it against the Best fit result and use local geological knowledge (a nearby borehole, known stratigraphy) to judge which is more plausible here.</div></div>` : ''}
      ${tailDecelerationNoteHtml(m)}
      ${renderLayerStick(m)}
      <div class="stat-grid">
        <div class="stat"><div class="n">${m.rmsPercent.toFixed(1)}%</div><div class="l">RMS misfit${m.curveSmoothed ? ' (smoothed curve)' : ''}</div></div>
        <div class="stat"><div class="n">${m.nLayers}</div><div class="l">Layers</div></div>
      </div>
      ${m.curveSmoothed ? `<div class="alert info">${ICONS.bolt}<div>Fitted to a smoothed copy of your curve. RMS against your raw logged readings: ${m.rawRmsPercent.toFixed(1)}%.</div></div>` : ''}
      <div class="alert ${fitClass}">${ICONS.bolt}<div>${fitWord}</div></div>
      <div class="chart-frame" id="invert-chart">
        <div class="chart-dl" onclick="downloadChartFrame('invert-chart', 'VES_ModelFit_${stationSlug()}.png')">${ICONS.download}</div>
        ${buildLogLogChart([
          {points:m.observed, color:'#b5730e', style:'scatter'},
          {points:m.predicted, color:'#1f6259', style:'line', dashed:true},
          {points:buildLayerStaircase(m, m.observed.map(p=>p[0])), color:'#a63a2c', style:'line', dashArray:'7,3', strokeWidth:1.4},
        ])}
      </div>
      <div class="legend">
        <span class="sw"><span class="dot" style="background:#b5730e"></span>Field data</span>
        <span class="sw"><span class="ln"></span>Model curve</span>
        <span class="sw"><span class="ln" style="border-top-color:#a63a2c"></span>Layer model</span>
      </div>
    `;
  }

  return `
    <div class="section-title">Auto-invert layers</div>
    <!-- <div class="section-sub">Fits layer resistivity + thickness to your ${state.data.length} logged reading(s) using a Ghosh/YM6 forward model and a bounded Levenberg-Marquardt least-squares solver.</div> -->
    <label>Number of layers</label>
    <div class="seg">
      ${Array.from({length: maxLayers-1}, (_,i)=>i+2).map(n =>
        `<button class="${state.invertLayers===n?'active':''}" onclick="state.invertLayers=${n}; render();">${n}</button>`
      ).join('')}
    </div>
    <label>Fit method</label>
    <div class="seg">
      <button class="${state.invertMethod==='bestfit'?'active':''}" onclick="state.invertMethod='bestfit'; render();">Best fit</button>
      <button class="${state.invertMethod==='smoothed'?'active':''}" onclick="state.invertMethod='smoothed'; render();">Smoothed (Occam)</button>
    </div>
    <div class="section-sub" style="margin-top:-8px;">${state.invertMethod==='smoothed'
      ? "Finds the smoothest layer sequence that still fits nearly as well as the best possible fit. Can be closer to the true structure when the raw data has noise-driven wiggles \u2014 but not always; it's a second lens, not a replacement for Best fit."
      : "The single model that fits your logged readings most closely. Can occasionally chase small non-geological wiggles in the data into an unrealistically thin layer \u2014 try Smoothed (Occam) alongside it if a result here looks physically implausible."}</div>
    <label>Field curve</label>
    <div class="seg">
      <button class="${!state.curveSmoothing?'active':''}" onclick="state.curveSmoothing=false; render();">As logged</button>
      <button class="${state.curveSmoothing?'active':''}" onclick="state.curveSmoothing=true; render();">Smoothed (IPI2Win-style)</button>
    </div>
    <div class="section-sub" style="margin-top:-8px;">${state.curveSmoothing
      ? "Fits a smoothed copy of your curve, as IPI2Win and WinResist do: readings at the same AB/2 are averaged, then the curve is smoothed in log-log space. This removes MN/2-change jumps and noise, so the RMS is comparable to theirs. The RMS against your raw readings is shown alongside."
      : "Fits your readings exactly as logged, including any jumps where MN/2 was changed."}</div>
    <button class="btn primary block" id="invert-btn" onclick="runInversion()">Run inversion</button>
    ${resultHtml}
  `;
}
function runInversion(){
  const btn = el('invert-btn');
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Running inversion\u2026`;
  setTimeout(() => {
    const method = state.invertMethod || 'bestfit';
    const fitData = state.curveSmoothing ? smoothFieldCurve(state.data) : state.data;
    const model = method === 'smoothed'
      ? invert1DModelSmoothed(fitData, state.invertLayers)
      : invert1DModel(fitData, state.invertLayers);
    if (state.curveSmoothing) attachRawFit(model, state.data);
    model.source = 'invert';
    model.method = method;
    state.lastModel = model;
    render();
  }, 40);
}

function viewDesign(){
  const rowsHtml = state.designLayers.map((l,i) => {
    const isLast = i === state.designLayers.length - 1;
    return `
      <div class="layer-form-row">
        <div class="li-num">${i+1}</div>
        <input type="number" step="any" placeholder="\u03A9\u00B7m" value="${l.rho}" oninput="state.designLayers[${i}].rho=parseFloat(this.value)||0; resetDesignIteration();">
        ${isLast ? `<div style="font-size:11px; color:var(--text-dimmer); display:flex; align-items:center;">\u221E</div>`
                 : `<input type="number" step="any" placeholder="thickness (m)" value="${l.h}" oninput="state.designLayers[${i}].h=parseFloat(this.value)||0; resetDesignIteration();">`}
      </div>`;
  }).join('');
  const hasData = state.data.length > 0;
  const n = state.designLayers.length;
  const minNeeded = Math.max(4, 2*n - 1);
  const canRefine = state.data.length >= minNeeded;

  let resultHtml = '';
  if (state.lastModel && state.lastModel.source === 'design'){
    const m = state.lastModel;
    const isIteration = m.method === 'iterate';
    let fitHtml = '';
    if (m.refined){
      const fitClass = m.rmsPercent < 5 ? 'ok' : m.rmsPercent < 12 ? 'info' : 'err';
      const fitWord = m.rmsPercent < 5 ? 'Excellent fit' : m.rmsPercent < 12 ? 'Reasonable fit' : (isIteration ? 'Still a high misfit \u2014 keep iterating, or try different starting values' : 'High misfit \u2014 try different starting values or more layers');
      fitHtml = `
        <div class="stat-grid">
          <div class="stat"><div class="n">${m.rmsPercent.toFixed(1)}%</div><div class="l">RMS misfit</div></div>
          <div class="stat"><div class="n">${m.nLayers}</div><div class="l">Layers</div></div>
        </div>
        ${m.method === 'smoothed' ? `<div class="alert info">${ICONS.bolt}<div>Smoothed (Occam) result \u2014 trades some raw fit quality for a smoother layer sequence. Compare it against the Best fit refinement and use local geological knowledge to judge which is more plausible here.</div></div>` : ''}
        <div class="alert ${fitClass}">${ICONS.bolt}<div>${fitWord} \u2014 your inputs above have been updated ${isIteration ? 'after this iteration step' : 'to the refined values'}.</div></div>
      `;
    }
    resultHtml = `
      <div class="divider"></div>
      <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span>${isIteration ? `Iteration ${state.designIterationCount} result` : (m.refined ? (m.method === 'smoothed' ? 'Refined model (Smoothed)' : 'Refined model (Best fit)') : 'Model preview')}</span>
        <div class="icon-btn" onclick="downloadModelImage(state.lastModel)">${ICONS.download}</div>
      </div>

function previewDesignModel(){

  const thk = state.designLayers.slice(0,-1).map(l=>Math.max(l.h,0.01));
  const ab2Values = state.data.length ? [...new Set(state.data.map(r=>r.ab2))].sort((a,b)=>a-b)
                                 : [1,1.5,2,3,5,7,10,15,20,30,50,70,100];
  const predicted = forwardModelSchlumberger(res, thk, ab2Values);
  const depths = []; let running=0;
  thk.forEach(t=>{running+=t; depths.push(running);});

    source:'design', refined:false, nLayers:n, resistivities:res, thicknesses:thk, depths, rmsPercent:0,
    observed: state.data.map(r=>[r.ab2,r.rho]),
