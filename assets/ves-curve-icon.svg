<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>VES Field Assistant — resistivity sounding curve icon</title>
  <rect x="2" y="2" width="196" height="196" rx="28" fill="#faf8f3" stroke="rgba(120,72,22,0.22)" stroke-width="2"/>

  <!-- subtle log-log grid -->
  <g stroke="rgba(120,72,22,0.14)" stroke-width="1">
    <line x1="34" y1="38" x2="34" y2="156"/>
    <line x1="34" y1="156" x2="172" y2="156"/>
    <line x1="68" y1="38" x2="68" y2="156"/>
    <line x1="102" y1="38" x2="102" y2="156"/>
    <line x1="136" y1="38" x2="136" y2="156"/>
    <line x1="34" y1="122" x2="172" y2="122"/>
    <line x1="34" y1="88" x2="172" y2="88"/>
    <line x1="34" y1="54" x2="172" y2="54"/>
  </g>

  <!-- sounding curve: gentle dip then sustained rise, the classic VES shape -->
  <path d="M 34 110 C 50 96, 60 90, 68 94 C 78 99, 86 112, 96 118 C 110 126, 126 110, 140 84 C 152 62, 162 48, 172 42"
        fill="none" stroke="#1f6259" stroke-width="5" stroke-linecap="round"/>

  <!-- data point markers -->
  <g fill="#b5730e">
    <circle cx="34" cy="110" r="5"/>
    <circle cx="52" cy="98" r="5"/>
    <circle cx="68" cy="94" r="5"/>
    <circle cx="84" cy="109" r="5"/>
    <circle cx="96" cy="118" r="5"/>
    <circle cx="116" cy="105" r="5"/>
    <circle cx="140" cy="84" r="5"/>
    <circle cx="158" cy="56" r="5"/>
    <circle cx="172" cy="42" r="5"/>
  </g>

  <!-- axis ticks -->
  <g stroke="#a89d89" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="156" x2="38" y2="156"/>
    <line x1="34" y1="156" x2="34" y2="164"/>
  </g>
</svg>
